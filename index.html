<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0b0e" />
  <title>Chow Heaven</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Galada&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script type="importmap">
    {
      "imports": {
        "@websim/websim-socket": "https://esm.websim.com/@websim/websim-socket"
      }
    }
  </script>
</head>
<body>
  <div id="toast-root"></div>
  <div id="modal-root"></div>

  <header class="topbar">
    <div class="topbar-inner">
      <button class="brand" data-nav="menu">
        <span class="brand-logo"><span class="c">C</span><span class="h">H</span></span>
        <span class="brand-text">Chow<span class="brand-heaven">Heaven</span></span>
      </button>
      <nav class="main-nav" aria-label="Primary">
        <button class="nav-item" data-nav="menu">Menu</button>
        <button class="nav-item" data-nav="orders">My Orders</button>
        <button class="nav-item" data-nav="purchases">Purchases</button>
        <button class="nav-item" data-nav="account">Account</button>
      </nav>
      <div class="topbar-actions">
        <label class="theme-switch" title="Appearance">
          <select class="theme-select" id="theme-select" aria-label="Appearance">
            <option value="dark">🌙 Dark</option>
            <option value="light">☀️ White</option>
            <option value="system">🖥️ System</option>
          </select>
        </label>
        <button class="icon-btn" data-nav="orders" id="notif-bell" aria-label="Notifications" title="Notifications">
          <span class="icon">&#128276;</span><span class="notif-dot hidden" id="notif-dot"></span>
        </button>
        <button class="cart-btn" data-nav="cart" aria-label="Cart">
          <span>&#128722;</span><span class="cart-count" id="cart-count">0</span>
        </button>
      </div>
    </div>
  </header>

  <main id="view"></main>
  <div id="cartbar-root"></div>

  <footer class="footer">
    <div class="footer-inner">
      <span class="footer-brand">Chow<span class="brand-heaven">Heaven</span></span>
      <span class="footer-info">42 Market Street, Lagos Island<span>•</span>Open Daily 11am – 10pm<span>•</span>+234 803 555 0199</span>
    </div>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
